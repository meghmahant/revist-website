<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revist | Customer Retention Automation for Restaurants</title>
    <meta
      name="description"
      content="Revist helps restaurants and cafés identify inactive customers, understand customer behaviour and reconnect with eligible customers through personalised WhatsApp campaigns."
    />
    <link rel="canonical" href="https://therevist.in/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://therevist.in/" />
    <meta property="og:title" content="Revist | Customer Retention Automation for Restaurants" />
    <meta
      property="og:description"
      content="Great food brings them in. Revist brings them back. Turn inactive customers into opportunities for repeat business."
    />
    <meta property="og:site_name" content="Revist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revist | Customer Retention Automation for Restaurants" />
    <meta
      name="twitter:description"
      content="Understand your customers, identify inactivity and reconnect with eligible customers through personalised WhatsApp campaigns."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/assets/favicon.png" />

    <!-- Typography: Space Grotesk (display) + Inter (body & tabular numbers) + JetBrains Mono (data labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash prior to React hydration -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('revist-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
