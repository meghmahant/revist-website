name: Build, Test, and Deploy Revist Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, Lint, and Unit Tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build Production Bundle
        env:
          VITE_BRAND_NAME: ${{ vars.VITE_BRAND_NAME }}
          VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
          VITE_BUSINESS_EMAIL: ${{ vars.VITE_BUSINESS_EMAIL }}
          VITE_BUSINESS_PHONE: ${{ vars.VITE_BUSINESS_PHONE }}
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT || 'https://revist-lead-proxy.megh-mahant123.workers.dev' }}
          VITE_CLIENT_DASHBOARD_URL: ${{ vars.VITE_CLIENT_DASHBOARD_URL }}
          VITE_PRIVACY_POLICY_VERSION: ${{ vars.VITE_PRIVACY_POLICY_VERSION }}
          VITE_TERMS_VERSION: ${{ vars.VITE_TERMS_VERSION }}
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
